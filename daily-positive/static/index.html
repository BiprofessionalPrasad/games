<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Positive • Boost</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Playfair+Display:wght@700&amp;display=swap');
    
    :root {
      --accent: #10b981;
    }
    
    body {
      font-family: 'Inter', system_ui, sans-serif;
    }
    
    .heading-font {
      font-family: 'Playfair Display', Georgia, serif;
    }

    .positive-gradient {
      background: linear-gradient(135deg, #ecfdf5 0%, #f0fdfa 50%, #fefce8 100%);
    }

    .quote-card {
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.05), 0 8px 10px -6px rgb(0 0 0 / 0.05);
    }

    .quote-card.show {
      animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.8) translateY(20px);
      }
      50% {
        transform: scale(1.03) translateY(-4px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .boost-btn {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    
    .boost-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 20px 25px -5px rgb(16 185 129 / 0.15), 0 8px 10px -6px rgb(16 185 129 / 0.15);
    }
    
    .boost-btn:active {
      transform: translateY(-1px) scale(0.985);
    }

    .boost-btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -100%;
      width: 50%;
      height: 200%;
      background: linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,0.35),
        transparent
      );
      transition: 0.6s;
    }
    
    .boost-btn:hover::after {
      left: 250%;
    }

    .quote-text {
      font-size: 1.15rem;
      line-height: 1.6;
      font-weight: 500;
      color: #134e4b;
    }

    .section-shadow {
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.05),
                  0 4px 6px -4px rgb(0 0 0 / 0.05);
    }

    .soft-glow {
      box-shadow: 0 0 0 1px #a7f3d0;
    }
  </style>
</head>
<body class="positive-gradient min-h-screen flex items-center justify-center p-4 sm:p-6">
  <div class="w-full max-w-lg mx-auto">
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-white rounded-2xl shadow-sm mb-4 soft-glow">
        <span class="text-4xl">🌱</span>
      </div>
      <h1 class="text-4xl sm:text-5xl font-semibold tracking-tighter text-emerald-950 heading-font">Daily Positive</h1>
      <p class="mt-2 text-emerald-700/80 text-lg">A little boost, whenever you need it.</p>
    </div>

    <!-- Main Card -->
    <div class="bg-white rounded-3xl shadow-xl p-8 sm:p-10 section-shadow">
      
      <!-- Button -->
      <div class="text-center">
        <button 
          id="give-btn"
          class="boost-btn w-full sm:w-auto inline-flex items-center justify-center gap-x-3 px-12 py-4 text-xl font-semibold bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white rounded-2xl shadow-lg shadow-emerald-500/30 focus:outline-none focus:ring-4 focus:ring-emerald-200">
          <i class="fa-solid fa-hand-holding-heart text-2xl"></i>
          <span>Give me</span>
        </button>
        <p class="text-xs text-emerald-700/60 mt-3 tracking-wide">click for a random positive quote, message or boost</p>
      </div>

      <!-- Quote Display -->
      <div id="quote-container" class="hidden mt-9">
        <div class="quote-card bg-emerald-50/70 border border-emerald-100 rounded-3xl p-7 sm:p-8">
          <div class="flex items-start gap-4">
            <!-- Emoji -->
            <div id="quote-emoji" 
                 class="flex-shrink-0 w-12 h-12 flex items-center justify-center text-4xl select-none">
            </div>
            
            <div class="flex-1 min-w-0 pt-1">
              <div class="flex items-center gap-2 mb-2">
                <span class="uppercase tracking-[1.5px] text-[10px] font-semibold text-emerald-600/70">Your boost</span>
              </div>
              
              <blockquote id="quote-text" 
                          class="quote-text leading-relaxed">
              </blockquote>
              
              <div id="quote-source" 
                   class="hidden mt-3 text-xs text-emerald-700/70 font-medium">
              </div>

              <!-- Live X link (only shown for posts from X) -->
              <div id="quote-link" class="hidden mt-2">
                <a href="#" target="_blank" rel="noopener"
                   class="inline-flex items-center gap-1 text-[11px] font-medium text-emerald-600 hover:text-emerald-800 underline-offset-2 hover:underline">
                  <span>View on 𝕏</span>
                  <i class="fa-solid fa-external-link-alt text-[9px]"></i>
                </a>
              </div>

              <!-- Source badge -->
              <div id="quote-badge" 
                   class="hidden mt-2 inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold tracking-wide bg-emerald-100 text-emerald-700">
              </div>
            </div>
          </div>
        </div>

        <!-- Actions -->
        <div class="flex items-center justify-between mt-4 px-1">
          <button 
            id="copy-btn"
            class="inline-flex items-center gap-x-2 text-sm font-medium px-4 py-2 rounded-xl text-emerald-700 hover:bg-emerald-100/70 active:bg-emerald-200/70 transition-colors">
            <i class="fa-solid fa-copy"></i>
            <span id="copy-text">Copy</span>
          </button>

          <button 
            id="another-btn"
            class="inline-flex items-center gap-x-2 text-sm font-semibold px-5 py-2 rounded-xl bg-white text-emerald-700 border border-emerald-200 hover:bg-emerald-50 active:bg-emerald-100 transition-all">
            <i class="fa-solid fa-sync-alt"></i>
            <span>Another one</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Subtle footer info -->
    <div class="text-center mt-6">
      <div class="inline-flex items-center gap-1.5 text-xs text-emerald-800/60">
        <i class="fa-solid fa-heart text-emerald-400"></i>
        <span>Positivity delivered in Docker</span>
      </div>
    </div>
  </div>

  <script>
    // Tailwind script configuration
    function initTailwind() {
      document.documentElement.style.setProperty('--accent', '#10b981');
    }

    // Small local fallback list (used when opening index.html directly as a file,
    // or if the backend is unreachable). The Docker app uses /api/boost for fresh content.
    const localFallbackQuotes = [
      "I am enough just as I am.",
      "I am worthy of love, joy, and happiness.",
      "I am capable of achieving my goals.",
      "Every day is a fresh start filled with new possibilities.",
      "I choose joy and gratitude today.",
      "I am strong, resilient, and brave.",
      "I trust that I am exactly where I need to be.",
      "I radiate love and positivity.",
      "I am at peace with what is.",
      "I am growing at my own perfect pace.",
      "One small positive thought can change your whole day.",
      "You've got this. One step at a time.",
      "Progress, not perfection.",
      "Your potential is endless. Go shine.",
      "Today I choose to see the good.",
      "My heart is open and my spirit is light."
    ];

    const emojis = ['🌱', '☀️', '🌟', '💚', '🦋', '🌈', '✨', '💖', '🍃', '🔆', '🌻', '🕊️'];

    let lastLocalIndex = -1;

    function getRandomLocalFallback() {
      let index;
      do {
        index = Math.floor(Math.random() * localFallbackQuotes.length);
      } while (index === lastLocalIndex && localFallbackQuotes.length > 1);
      lastLocalIndex = index;
      return localFallbackQuotes[index];
    }

    function getRandomEmoji() {
      return emojis[Math.floor(Math.random() * emojis.length)];
    }

    // New unified display function that handles both local and live X data
    function showBoost(data) {
      const container = document.getElementById('quote-container');
      const textEl = document.getElementById('quote-text');
      const emojiEl = document.getElementById('quote-emoji');
      const sourceEl = document.getElementById('quote-source');
      const linkEl = document.getElementById('quote-link');
      const badgeEl = document.getElementById('quote-badge');
      const linkAnchor = linkEl ? linkEl.querySelector('a') : null;

      // Set main text
      textEl.textContent = data.text || '';

      // Random fresh emoji each time
      emojiEl.textContent = getRandomEmoji();

      // Attribution / source line (e.g. "Good News Network (@goodnewsnetwork)")
      if (data.attribution) {
        sourceEl.textContent = data.attribution;
        sourceEl.classList.remove('hidden');
      } else {
        sourceEl.classList.add('hidden');
      }

      // External link (for X posts or other live sources)
      if (linkEl && linkAnchor && data.url) {
        linkAnchor.href = data.url;
        // Customize label
        const linkText = data.source === 'X' ? 'View on 𝕏' : 'Source';
        linkAnchor.innerHTML = `<span>${linkText}</span><i class="fa-solid fa-external-link-alt text-[9px]"></i>`;
        linkEl.classList.remove('hidden');
      } else if (linkEl) {
        linkEl.classList.add('hidden');
      }

      // Source badge
      if (badgeEl) {
        const src = (data.source || '').toLowerCase();
        if (src === 'x') {
          badgeEl.textContent = '𝕏 LIVE';
          badgeEl.classList.remove('hidden');
        } else if (src && src !== 'curated') {
          badgeEl.textContent = (data.source || 'LIVE').toUpperCase();
          badgeEl.classList.remove('hidden');
        } else {
          badgeEl.textContent = 'CURATED';
          badgeEl.classList.remove('hidden');
        }
      }

      // Reveal the card
      if (container.classList.contains('hidden')) {
        container.classList.remove('hidden');
        container.classList.add('flex', 'flex-col');
      }

      // Pop animation
      const card = container.querySelector('.quote-card');
      card.classList.remove('show');
      void card.offsetWidth;
      card.classList.add('show');

      resetCopyButton();

      // Store current data for copy
      window.__currentBoost = data;
    }

    function resetCopyButton() {
      const copyText = document.getElementById('copy-text');
      copyText.textContent = 'Copy';
      copyText.parentElement.classList.remove('text-emerald-600');
    }

    function copyCurrentQuote() {
      const data = window.__currentBoost || {};
      let fullText = (data.text || document.getElementById('quote-text').textContent || '').trim();

      if (data.attribution) {
        fullText += '\n— ' + data.attribution;
      }
      if (data.url) {
        fullText += '\n' + data.url;
      }

      navigator.clipboard.writeText(fullText).then(() => {
        const copyText = document.getElementById('copy-text');
        copyText.textContent = 'Copied!';
        copyText.parentElement.classList.add('text-emerald-600');

        setTimeout(() => {
          if (copyText.textContent === 'Copied!') resetCopyButton();
        }, 1800);
      }).catch(() => {
        // Clipboard fallback
        const ta = document.createElement('textarea');
        ta.value = fullText;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        const copyText = document.getElementById('copy-text');
        copyText.textContent = 'Copied!';
        setTimeout(resetCopyButton, 1800);
      });
    }

    async function giveBoost() {
      const giveBtn = document.getElementById('give-btn');
      const originalText = giveBtn.innerHTML;

      // Visual feedback while fetching
      giveBtn.disabled = true;
      giveBtn.style.opacity = '0.7';
      giveBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Finding...';

      try {
        const res = await fetch('/api/boost', { cache: 'no-store' });
        if (!res.ok) throw new Error('API error');
        const data = await res.json();
        showBoost(data);
      } catch (err) {
        // Graceful fallback when running the HTML file directly or backend unavailable
        console.info('Using local fallback (no backend or direct file open)');
        const fallbackText = getRandomLocalFallback();
        showBoost({
          text: fallbackText,
          attribution: null,
          source: 'curated',
          url: null
        });
      } finally {
        giveBtn.disabled = false;
        giveBtn.style.opacity = '1';
        giveBtn.innerHTML = originalText;
      }
    }

    function initApp() {
      initTailwind();

      const giveBtn = document.getElementById('give-btn');
      const anotherBtn = document.getElementById('another-btn');
      const copyBtn = document.getElementById('copy-btn');

      // Primary actions now go through the async giveBoost (hits /api/boost in Docker)
      giveBtn.addEventListener('click', giveBoost);
      anotherBtn.addEventListener('click', giveBoost);

      copyBtn.addEventListener('click', copyCurrentQuote);

      // Keyboard: G or Space for boost, C to copy
      document.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'g' || e.key === ' ') {
          if (document.activeElement.tagName === 'BUTTON') return;
          if (e.key === ' ' && document.activeElement.tagName === 'BUTTON') return;
          e.preventDefault();
          giveBoost();
        }
        if (e.key.toLowerCase() === 'c' && !document.getElementById('quote-container').classList.contains('hidden')) {
          if (document.activeElement.tagName === 'BUTTON') return;
          copyCurrentQuote();
        }
      });

      // Click emoji for another
      const emojiArea = document.getElementById('quote-emoji');
      emojiArea.addEventListener('click', () => {
        if (!document.getElementById('quote-container').classList.contains('hidden')) {
          giveBoost();
        }
      });
      emojiArea.style.cursor = 'pointer';

      giveBtn.setAttribute('aria-label', 'Give me a positive boost');

      // Optional: show one automatically after a couple seconds (commented for clean first-click experience)
      // setTimeout(() => { if (document.getElementById('quote-container').classList.contains('hidden')) giveBoost(); }, 2600);
    }

    // Boot
    window.onload = initApp;
  </script>
</body>
</html>
