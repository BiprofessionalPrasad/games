services:
  daily-positive:
    build: .
    container_name: daily-positive
    ports:
      - "8080:8080"
    environment:
      # Optional: set your X (Twitter) Bearer Token for live pulls of latest positive posts & good news.
      # Get one free at https://developer.x.com/ (Essential access is sufficient).
      # Without it the app uses the rich local curated list.
      - X_BEARER_TOKEN=${X_BEARER_TOKEN:-}
    restart: unless-stopped
    # For local .env file support you can also add:
    # env_file: .env
